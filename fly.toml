app = "vayug"
primary_region = "sin"

# Single process — app + integrated video worker dono ek saath chalenge
[processes]
  app = "npm start"

[env]
  PORT = "8080"
  # Integrated worker enabled — separate worker machine ki zarurat nahi
  DISABLE_INTEGRATED_WORKER = "false"

[build]

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "10s"

# Single 2GB machine — app + worker dono handle karega
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ["app"]
