app = "vayug"
primary_region = "sin"

# Do process groups jaan-boojh kar:
#   app    → Fly Proxy manage karta hai (HTTP pe auto-start, idle pe auto-stop)
#   worker → Proxy ke bahar. FFmpeg encode ke beech me koi ise band nahi kar sakta.
[processes]
  app = "npm start"
  worker = "npm run worker"

[env]
  PORT = "8080"
  # app process worker NA chalaye — uske liye alag worker machine hai.
  DISABLE_INTEGRATED_WORKER = "true"

[build]

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "10s"

# Web API — chhoti machine, idle pe proxy khud stop kar deta hai.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ["app"]

# FFmpeg worker — 'worker' group ko http_service se BAHAR rakha gaya hai.
# Fly Proxy is machine ko na start karta hai na stop, isliye encode ke beech
# me ye kabhi nahi marti. Job queue me aate hi _wakeWorker (Machines API)
# ise jagata hai, aur queue khali hone par ye khud exit ho jaati hai.
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ["worker"]
