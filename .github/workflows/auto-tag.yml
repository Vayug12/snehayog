name: Auto Tag

on:
  push:
    branches: [main]
    paths:
      - 'frontend/pubspec.yaml'
  workflow_dispatch:

concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag on version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout reports a bad token as "could not read Username",
      # which says nothing about why. Diagnose it here instead. Only the HTTP
      # status is ever printed; the token itself is never echoed.
      - name: Verify RELEASE_PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -uo pipefail
          if [[ -z "${RELEASE_PAT:-}" ]]; then
            echo 'No RELEASE_PAT set; falling back to GITHUB_TOKEN (tag will not trigger Release).'
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_PAT" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          case "$code" in
            200)
              echo "RELEASE_PAT authenticates and can see $GITHUB_REPOSITORY."
              ;;
            401)
              echo "::error::RELEASE_PAT rejected (401): the stored value is invalid or malformed. Re-set the secret — a stray newline or truncated paste is the usual cause."
              exit 1
              ;;
            403)
              echo "::error::RELEASE_PAT forbidden (403): token is valid but blocked for $GITHUB_REPOSITORY."
              exit 1
              ;;
            404)
              echo "::error::RELEASE_PAT cannot see $GITHUB_REPOSITORY (404): the repository is not in the token's Repository access list."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP $code while validating RELEASE_PAT."
              exit 1
              ;;
          esac

      - name: Checkout with full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN cannot trigger other
          # workflows. Supplying RELEASE_PAT lets the new tag start Release.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Create tag if the pubspec version is new
        id: tag
        env:
          # Presence check only; never interpolate a secret into the script body.
          HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]\{1,\}\).*/\1/p' \
            frontend/pubspec.yaml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error file=frontend/pubspec.yaml::Could not parse a version line"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error file=frontend/pubspec.yaml::Version '$version' is not semver; refusing to tag"
            exit 1
          fi

          tag="v$version"
          git fetch --tags --force --quiet

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf 'Tag %s already exists; nothing to do.\n' "$tag"
            printf '%s\n' "### No new tag" '' \
              "\`$tag\` already exists. Bump \`version:\` in \`frontend/pubspec.yaml\` to cut a release." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Release $tag"
          git push origin "refs/tags/$tag"

          printf '%s\n' "### Tagged \`$tag\`" '' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$HAS_RELEASE_PAT" == 'true' ]]; then
            printf '%s\n' "Release will build and publish automatically." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' \
              "Release was **not** triggered: tags pushed with the default \`GITHUB_TOKEN\` cannot start other workflows." \
              "Add a \`RELEASE_PAT\` secret (repo scope) to chain them, or run Release manually." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
