name: Mobile AI QA

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    # 02:00 India Standard Time every day.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test; empty means the latest release'
        required: false
        type: string
      suite:
        description: 'Maestro tag to run'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression

concurrency:
  group: mobile-ai-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  models: read

env:
  MAESTRO_VERSION: '2.7.0'
  MOBILE_QA_MODEL: ${{ vars.MOBILE_QA_MODEL || 'openai/gpt-4o' }}

jobs:
  android-release-qa:
    name: Android release journeys
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test definitions
        uses: actions/checkout@v4

      - name: Resolve release APK
        id: apk
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.event.workflow_run.head_branch || '' }}
        run: |
          mkdir -p qa-apk qa-results
          if [[ -z "$RELEASE_TAG" ]]; then
            if ! RELEASE_TAG="$(gh release view --json tagName --jq '.tagName' 2>qa-results/release-lookup.log)"; then
              if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]] && grep -qi 'release not found' qa-results/release-lookup.log; then
                echo 'available=false' >> "$GITHUB_OUTPUT"
                printf '%s\n' 'No published GitHub Release exists yet; scheduled mobile QA was skipped.' > qa-results/skip-reason.txt
                printf '%s\n' '### Mobile QA skipped' '' 'No published GitHub Release exists yet, so there is no APK to test.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              printf '%s\n' 'Unable to resolve a published GitHub Release for mobile QA.' > qa-results/infrastructure-error.txt
              exit 2
            fi
          fi
          printf '%s' "$RELEASE_TAG" > qa-apk/release-tag.txt
          jq -n --arg releaseTag "$RELEASE_TAG" '{releaseTag: $releaseTag}' > qa-results/run-metadata.json
          if ! gh release download "$RELEASE_TAG" --pattern '*.apk' --dir qa-apk --clobber; then
            printf 'Release %s does not contain a downloadable APK.\n' "$RELEASE_TAG" > qa-results/infrastructure-error.txt
            exit 2
          fi
          if ! find qa-apk -type f -name '*.apk' -print -quit | grep -q .; then
            printf 'Release %s does not contain a downloadable APK.\n' "$RELEASE_TAG" > qa-results/infrastructure-error.txt
            exit 2
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Set up Java for Maestro
        if: steps.apk.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Maestro CLI
        if: steps.apk.outputs.available == 'true'
        env:
          MAESTRO_VERSION: ${{ env.MAESTRO_VERSION }}
        run: |
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable Android emulator acceleration
        if: steps.apk.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro journeys on release APK
        id: maestro
        if: steps.apk.outputs.available == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_TAGS: ${{ inputs.suite || 'smoke' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/mobile-qa/run-maestro.sh

      - name: AI triage and deduplicated GitHub issues
        if: always() && steps.apk.outputs.available != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_APK_STATUS: ${{ steps.apk.outcome }}
          QA_EXECUTION_STATUS: ${{ steps.maestro.outcome }}
        run: node scripts/mobile-qa/triage-results.mjs

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-evidence-${{ github.run_id }}
          path: qa-results
          if-no-files-found: warn
          retention-days: 14

      - name: Mark failed mobile journey
        if: always() && steps.apk.outputs.available != 'false' && (steps.apk.outcome != 'success' || steps.maestro.outcome != 'success')
        run: exit 1
