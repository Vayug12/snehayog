name: Mobile AI QA

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    # 02:00 India Standard Time every day.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test; empty means the default branch'
        required: false
        type: string
      suite:
        description: 'Maestro tag to run'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression

concurrency:
  group: mobile-ai-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  models: read

env:
  MAESTRO_VERSION: '2.7.0'
  MOBILE_QA_MODEL: ${{ vars.MOBILE_QA_MODEL || 'openai/gpt-4o' }}

jobs:
  qa-apk:
    name: Build QA APK
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve ref under test
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.release.tag_name || github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          ref="${REQUESTED_REF:-$GITHUB_REF_NAME}"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'Testing ref: %s\n' "$ref"

      - name: Checkout ref under test
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      # No keystore is written, so the release build type falls back to the
      # debug signing key. Installable on an emulator, never distributable.
      - name: Build unsigned QA APK
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Stage APK and metadata
        env:
          REF_UNDER_TEST: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p qa-apk
          cp frontend/build/app/outputs/flutter-apk/app-release.apk qa-apk/
          printf '%s' "$REF_UNDER_TEST" > qa-apk/release-tag.txt

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: qa-apk-${{ github.run_id }}
          path: qa-apk
          if-no-files-found: error
          retention-days: 7

  android-qa:
    name: Android journeys
    needs: qa-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.qa-apk.outputs.ref }}

      - name: Download QA APK
        id: apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qa-apk-${{ github.run_id }}
          path: qa-apk

      - name: Record APK metadata
        run: |
          set -euo pipefail
          mkdir -p qa-results
          if ! find qa-apk -type f -name '*.apk' -print -quit | grep -q .; then
            printf 'QA APK artifact was missing or empty.\n' > qa-results/infrastructure-error.txt
            exit 2
          fi
          jq -n --arg ref '${{ needs.qa-apk.outputs.ref }}' '{releaseTag: $ref}' > qa-results/run-metadata.json

      - name: Set up Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Maestro CLI
        env:
          MAESTRO_VERSION: ${{ env.MAESTRO_VERSION }}
        run: |
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro journeys
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_TAGS: ${{ inputs.suite || 'smoke' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/mobile-qa/run-maestro.sh

      - name: AI triage and deduplicated GitHub issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_APK_STATUS: ${{ steps.apk.outcome }}
          QA_EXECUTION_STATUS: ${{ steps.maestro.outcome }}
        run: node scripts/mobile-qa/triage-results.mjs

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-evidence-${{ github.run_id }}
          path: qa-results
          if-no-files-found: warn
          retention-days: 14

      - name: Mark failed mobile journey
        if: always() && (steps.apk.outcome != 'success' || steps.maestro.outcome != 'success')
        run: exit 1
